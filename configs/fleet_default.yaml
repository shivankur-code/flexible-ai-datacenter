# Default fleet parameters. Every number has a source or is marked ASSUMPTION;
# assumptions are swept in sensitivity runs (phase 3) and must be stated in the paper.

replica:                       # one serving replica = one 8-GPU server, tensor-parallel 8
  n_gpus: 8
  gpu_tdp_w: 700               # H100 SXM board power (NVIDIA datasheet)
  gpu_idle_w: 90               # ASSUMPTION: H100 idle ~70-100 W in published measurements
  gpu_mem_bytes: 80.0e+9       # H100 80 GB
  peak_flops: 989.0e+12        # H100 SXM dense BF16 per GPU (NVIDIA datasheet)
  mem_bw: 3.35e+12             # H100 SXM HBM3 B/s per GPU (NVIDIA datasheet)
  host_idle_w: 1500            # ASSUMPTION: CPUs, NICs, fans, PSU loss; DGX H100 max system power is 10.2 kW
  host_active_w: 2500          # ASSUMPTION: host power at full GPU activity
  mfu_prefill: 0.50            # ASSUMPTION: achieved FLOP utilisation in prefill
  mfu_decode: 0.30             # ASSUMPTION
  mbu_decode: 0.60             # ASSUMPTION: achieved memory-bandwidth utilisation in decode
  iter_overhead_s: 0.004       # ASSUMPTION: scheduler + kernel-launch overhead per iteration
  kv_mem_fraction: 0.90        # vLLM default gpu_memory_utilization
  max_batch: 256               # vLLM default max_num_seqs
  max_prefill_tokens: 2048     # tokens per iteration (decode + prefill chunks); vLLM max_num_batched_tokens, ASSUMPTION
  # Power-cap response. A phase that demands more power than the cap runs at
  # perf = ((cap - idle) / (demand - idle)) ** gamma
  # (DVFS: dynamic power grows ~ f^3, so compute-bound gamma ~ 1/3; memory-bound decode is less sensitive.)
  gamma_prefill: 0.333         # ASSUMPTION (physics-motivated)
  gamma_decode: 0.15           # ASSUMPTION
  # GPU activity (fraction of the dynamic range) by phase
  activity_prefill: 1.0        # ASSUMPTION: compute-bound, runs at the board limit
  activity_decode_min: 0.45    # ASSUMPTION: decode at batch 1
  activity_decode_max: 0.85    # ASSUMPTION: decode at batch >= decode_batch_sat
  decode_batch_sat: 128

model:                         # Llama-2/3-70B class, BF16
  params: 70.0e+9
  bytes_per_param: 2
  kv_bytes_per_token: 327680   # 2 (K,V) x 80 layers x 8 KV heads x 128 dim x 2 bytes (GQA)

facility:
  late_cost_per_mwh_h: 500     # penalty per MWh of batch work per hour past its deadline (reported as SLO miss)
  pue: 1.20                    # ASSUMPTION: modern hyperscale (reported fleet PUEs ~1.1-1.2)
  idle_servers_sleep: false    # spare servers stay powered on (hot standby); true = they draw sleep_w
  sleep_w: 300

slo:                           # interactive SLOs, p99 over requests
  conv: {ttft_s: 1.0, tpot_s: 0.10}
  code: {ttft_s: 1.0, tpot_s: 0.10}

power_caps: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5]   # fraction of GPU TDP (nvidia-smi -pl)

batch:                         # deferrable work (e.g. batch APIs with 24 h completion windows)
  deadline_h: 24
  fill_of_spare: 0.5           # batch energy = this fraction of the spare replica-hours (sweep 0-0.9)
  token_mix: conv              # token-size distribution used for batch requests

interactive:
  provisioning_utilisation: 0.8  # autoscaler keeps each replica at <= 80% of its full-power SLO capacity (at the hour's peak minute)
  peak_utilisation: 0.70       # peak-hour interactive replicas / total replicas (rest: batch + hot spare)
  utc_offset_h: -7             # trace is UTC; RTS-GMLC sits in the US Southwest (MST)

flex:
  # Shedding = power-capping active interactive replicas down to the lowest cap that still meets the
  # full SLO at the hour's peak-minute load. That spends latency headroom, so it is rationed:
  shed_hours_per_day: 4        # <= this many hours/day at full shed depth (as an energy budget)
  shed_cost_per_mwh: 0.0
